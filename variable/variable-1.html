<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>변수 1</title>
</head>
<body>
    <script>
    // 변수 공부
        // 변수 : 데이터를 담는 상자
        // 변수는 선언과 할당이 있음. (선언은 let 또는 const를 주로 사용) 
        let name = "김혜진"
        console.log(name); //화면에 출력이 안 될 경우 오류를 확인하기 위해 콘솔로그를 주로 사용
        // let은 재할당 가능, const는 재할당 불가능
        name = "홍길동"
        console.log(name);
        const age = "20"
        console.log(age);
        // age = "30"
        console.log(age);
        
        let username = prompt("이름을 입력하세요" , "ㅇㅇㅇ")
        console.log(username);
        document.write(`<h1>이름 : ${username} </h1>
                        <p>나이 : ${age} </p>`)
    </script>
</body>
</html>
